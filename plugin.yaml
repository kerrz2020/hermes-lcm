name: hermes-lcm
version: 1.0.0-rc.1
python_runtime: external  # Hermes installs nothing for this plugin and leaves its lint-only pyproject alone (hermes#122148)
description: "Lossless Context Management — standalone Hermes plugin with a DAG-based context engine that never loses a message"
author: "Voltropy / Hermes Community"
provides_tools:
  - lcm_grep
  - lcm_recall
  - lcm_query_state
  - lcm_compute
  - lcm_compile_evidence
  - lcm_evidence_pack
  - lcm_retrieve
  - lcm_recent
  - lcm_load_session
  - lcm_describe
  - lcm_expand
  - lcm_expand_query
  - lcm_status
  - lcm_inspect
  - lcm_doctor
